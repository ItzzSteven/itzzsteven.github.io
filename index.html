<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Steven</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
:root {
    --bg: #0d1117;
    --card: #161b22;
    --accent: #58a6ff;
    --text: #c9d1d9;
    --border: #30363d;
}
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.6; }

nav { position: sticky; top:0; background: rgba(13,17,23,0.95); backdrop-filter: blur(10px); border-bottom:1px solid var(--border); display:flex; justify-content:center; padding:1rem; z-index:1000;}
nav button { background:none; border:none; color:var(--text); margin:0 15px; cursor:pointer; font-weight:bold; font-size:1rem; transition:0.2s; }
nav button.active { color: var(--accent); border-bottom:2px solid var(--accent); }

.page { display:none; padding:60px 10%; animation: fadeIn 0.3s ease; }
.page.active { display:block; }
@keyframes fadeIn { from {opacity:0; transform:translateY(5px);} to {opacity:1; transform:translateY(0);} }

.hero { text-align:center; padding:40px 0; }
.hero h1 { font-size:3rem; color:#fff; margin:0; }
.hero p { font-family:monospace; color:var(--accent); font-size:1.1rem; }

.project-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:20px; margin-top:30px; }
.project-card { background:var(--card); border:1px solid var(--border); border-radius:12px; cursor:pointer; overflow:hidden; transition:0.3s ease; }
.project-card:hover { border-color: var(--accent); transform: translateY(-3px); }
.cover-box { height:180px; display:flex; align-items:center; justify-content:center; font-weight:bold; color:#fff; font-size:1.3rem; text-align:center; padding:20px; }
.details { display:none; padding:20px; border-top:1px solid var(--border); background: rgba(0,0,0,0.2);}
.details h3 { margin-top:0; color: var(--accent); font-size:1.1rem; }
.details p { font-size:0.9rem; margin-bottom:10px; }
.project-button { padding:8px 12px; cursor:pointer; background: var(--accent); border:none; color:#fff; border-radius:5px; font-size:0.9rem; }
.project-button:hover { opacity:0.85; }

.contact-card { max-width:500px; margin:50px auto; background:var(--card); padding:40px; border-radius:15px; text-align:center; border:1px solid var(--border); border-left:4px solid var(--accent);}
.email-link { display:block; font-size:1.8rem; color:var(--accent); text-decoration:none; margin-top:20px; font-family:monospace; word-break:break-all; }
.email-link:hover { text-decoration:underline; }
h2 { border-left:4px solid var(--accent); padding-left:15px; color:#fff; margin-bottom:30px; }
</style>
</head>
<body>

<nav>
    <button onclick="showPage('home')" id="homeBtn" class="active">HOME</button>
    <button onclick="showPage('projects')" id="projectsBtn">PROJECTS</button>
    <button onclick="showPage('about')" id="aboutBtn">ABOUT ME</button>
    <button onclick="showPage('contact')" id="contactBtn">CONTACT</button>
</nav>

<section id="home" class="page active">
    <div class="hero">
        <h1>Dev Steven</h1>
        <p>> HTML // PYTHON // C</p>
    </div>
    <h2>Projects</h2>
    <div id="featured-grid" class="project-grid"></div>
</section>

<section id="about" class="page">
    <div class="about-me">
        <h1>About Me</h1>
        <h2>Dev Steven</h2>
        <p>Hello, I`m Steven,</p>
        <p>i am good at coding in python, i am learning C, and java</p>
        <p>and im kinda good at JS/HTML</p>
    </div>
</section>

<section id="projects" class="page">
    <h2>All Projects</h2>
    <div id="full-grid" class="project-grid"></div>
</section>

<section id="contact" class="page">
    <div class="contact-card">
        <h2>Get In Touch</h2>
        <p>For inquiries or collaborations, reach out via email:</p>
        <a href="mailto:stevendacoder@outlook.com" class="email-link">stevendacoder@outlook.com</a>        
    </div>
</section>

<script>
const projectData = [
    { 
        title: "Viper", 
        lang:"Python, HTML", 
        description:"A programming language for web and app development.", 
        featured:true, 
        color:"linear-gradient(45deg,#1d2b64,#f8cdda)", 
        link:"https://github.com/ItzzSteven/Viper/" 
    },
    { 
        title: "py-editor", 
        lang:"Python", 
        description:"Python coded text editor with output for HTML and Python development.", 
        featured:false, 
        color:"linear-gradient(45deg,#11998e,#38ef7d)", 
        link:"./py-editor" },
    { 
        title: "ViperScript IDE", 
        lang:"HTML", 
        description:"IDE for ViperScript (Viper for web like micropython).", 
        featured:true, 
        color:"linear-gradient(45deg,#ff8c00,#ed1c24)", 
        link:"./viperscript-ide" },
    { 
        title: "Cube Engine", 
        lang:"Python", 
        description:"Game Engine in Python for Python game development.", 
        featured:false, color:"#21262d", 
        link:"cube-engine" },
    { 
        title: "ScratchThon", 
        lang:"HTML,JS", 
        description:"A Compiler that compiles Python (scratchthon) to Scratch with an IDE", 
        featured:true, color:"#699ff5", 
        link:"./scratch-thon/" },
    { 
        title: "Proximty", 
        lang:"HTML/JS", 
        description:"A proxy browser that can bypass most chromebook blocking using websocket secure protocol.", 
        featured:true, 
        color:"linear-gradient(45deg,#9D00ff,#9D00FF)", 
        link:"https://github.com/ItzzSteven/Viper/" 
    },
    { 
        title: "LCE Server List", 
        lang:"HTML,CSS,JS", 
        description:"A Server List for Minecraft Lagacy Console Edition", 
        featured:false, color:"#FFA900", 
        link:"https://lce-server-list.pages.dev" }
];

function createCard(project) {
    const card = document.createElement('div');
    card.className = 'project-card';

    const cover = document.createElement('div');
    cover.className = 'cover-box';
    cover.style.background = project.color;
    cover.textContent = project.title;
    card.appendChild(cover);

    const details = document.createElement('div');
    details.className = 'details';
    details.innerHTML = `<h3>${project.title} (${project.lang})</h3><p>${project.description}</p>`;

    const button = document.createElement('button');
    button.className = 'project-button';
    button.textContent = "View Project";
    button.onclick = (e)=>{ e.stopPropagation(); window.open(project.link,"_blank"); };
    details.appendChild(button);

    card.appendChild(details);

    card.addEventListener('click', ()=> {
        details.style.display = details.style.display==="block" ? "none" : "block";
    });

    return card;
}

function loadProjects() {
    const featuredContainer = document.getElementById('featured-grid');
    const fullContainer = document.getElementById('full-grid');

    projectData.forEach(p=>{
        if(p.featured) featuredContainer.appendChild(createCard(p));
        fullContainer.appendChild(createCard(p));
    });
}

function showPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.getElementById(id+'Btn').classList.add('active');
    window.scrollTo(0,0);
}

loadProjects();
</script>

</body>
</html>
